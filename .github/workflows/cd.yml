# ═══════════════════════════════════════════════════════════════
# unrealestate.au — CD pipeline (AloomU Stage-0)
# ═══════════════════════════════════════════════════════════════
# Pushes web + api images to git.aloomu.au/unrealestate-au.
# AloomU pulls them, runs migrations against Postgres, and the
# Caddy reverse-proxy serves https://unrealestate.au.
#
# Required repo secrets:
#   FORGEJO_CI_USERNAME   — `unrealestate-ci`
#   FORGEJO_CI_TOKEN      — write:package + read:repository on git.aloomu.au
# ═══════════════════════════════════════════════════════════════

name: CD - Push images to git.aloomu.au

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  DOTNET_VERSION: '9.0.x'
  REGISTRY: git.aloomu.au
  REGISTRY_NAMESPACE: unrealestate-au
  API_IMAGE: api
  WEB_IMAGE: web

jobs:
  # ─────────────────────────────────────────────────────────────
  # BUILD & TEST
  # ─────────────────────────────────────────────────────────────
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore Aigents.sln

      - name: Build solution
        run: dotnet build Aigents.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test Aigents.sln --configuration Release --no-build --verbosity normal
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────
  # BUILD + PUSH IMAGES TO FORGEJO
  # ─────────────────────────────────────────────────────────────
  publish:
    name: Build & push images
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to git.aloomu.au
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.FORGEJO_CI_USERNAME }}
          password: ${{ secrets.FORGEJO_CI_TOKEN }}

      - name: Build & push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/Aigents.Api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/${{ env.API_IMAGE }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/${{ env.API_IMAGE }}:latest
          build-args: |
            CACHE_BUST=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/Aigents.Web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/${{ env.WEB_IMAGE }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/${{ env.WEB_IMAGE }}:latest
          build-args: |
            CACHE_BUST=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          ## 🚀 Images published

          | Image | Tag |
          |-------|-----|
          | \`${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/${{ env.API_IMAGE }}\` | \`${{ github.sha }}\`, \`latest\` |
          | \`${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/${{ env.WEB_IMAGE }}\` | \`${{ github.sha }}\`, \`latest\` |

          ### Update AloomU compose stanza

          Patch \`docker-compose.aloomu.yml\` (or \`docker-compose.stage0.yml\` on AloomU side):

          \`\`\`
          unrealestate-web:
            image: ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/${{ env.WEB_IMAGE }}:${{ github.sha }}
          unrealestate-api:
            image: ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/${{ env.API_IMAGE }}:${{ github.sha }}
          \`\`\`

          Then on AloomU rack: \`docker compose pull && docker compose up -d\`.
          EOF

          echo "::notice title=API_image::${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/${{ env.API_IMAGE }}:${{ github.sha }}"
          echo "::notice title=WEB_image::${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/${{ env.WEB_IMAGE }}:${{ github.sha }}"
