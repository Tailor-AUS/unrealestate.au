# ═══════════════════════════════════════════════════════════════
# BIND unrealestate.au CUSTOM DOMAIN
#
# Run this manually after you've set the A / TXT / CNAME records
# at your registrar. It does not deploy code — it only re-runs the
# hostname add + bind against the existing production Container App
# and re-checks DNS. Use it whenever DNS propagates after the
# initial deploy, or when you change the apex IP / move registrar.
# ═══════════════════════════════════════════════════════════════

name: Bind unrealestate.au

on:
  workflow_dispatch:

env:
  AZURE_RESOURCE_GROUP: aigents-rg

jobs:
  bind:
    name: Bind unrealestate.au + www
    runs-on: ubuntu-latest

    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Read DNS targets from Azure
        id: dns
        run: |
          VERIFY_ID=$(az containerapp show -n aigents-web-production -g $AZURE_RESOURCE_GROUP --query "properties.customDomainVerificationId" -o tsv)
          INGRESS_FQDN=$(az containerapp show -n aigents-web-production -g $AZURE_RESOURCE_GROUP --query "properties.configuration.ingress.fqdn" -o tsv)
          STATIC_IP=$(az containerapp env show -n aigents-env-production -g $AZURE_RESOURCE_GROUP --query "properties.staticIp" -o tsv)
          echo "verify_id=${VERIFY_ID}"     >> $GITHUB_OUTPUT
          echo "ingress_fqdn=${INGRESS_FQDN}" >> $GITHUB_OUTPUT
          echo "static_ip=${STATIC_IP}"     >> $GITHUB_OUTPUT
          {
            echo "## 🌐 Targets"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Static IP (A record) | \`${STATIC_IP}\` |"
            echo "| Verification ID (TXT at asuid) | \`${VERIFY_ID}\` |"
            echo "| Ingress FQDN (CNAME for www) | \`${INGRESS_FQDN}\` |"
          } >> $GITHUB_STEP_SUMMARY

      - name: Resolve current DNS
        id: precheck
        run: |
          APEX_IP=$(dig +short A unrealestate.au @1.1.1.1 | head -n1 || true)
          ASUID_TXT=$(dig +short TXT asuid.unrealestate.au @1.1.1.1 | tr -d '"' | head -n1 || true)
          WWW_CNAME=$(dig +short CNAME www.unrealestate.au @1.1.1.1 | head -n1 || true)
          {
            echo "## 🔎 DNS resolution right now"
            echo ""
            echo "| Record | Resolved | Expected | Match |"
            echo "|---|---|---|---|"
            echo "| A unrealestate.au | \`${APEX_IP:-<empty>}\` | \`${{ steps.dns.outputs.static_ip }}\` | $([ "${APEX_IP}" = "${{ steps.dns.outputs.static_ip }}" ] && echo "✅" || echo "❌") |"
            echo "| TXT asuid.unrealestate.au | \`${ASUID_TXT:-<empty>}\` | \`${{ steps.dns.outputs.verify_id }}\` | $([ "${ASUID_TXT}" = "${{ steps.dns.outputs.verify_id }}" ] && echo "✅" || echo "❌") |"
            echo "| CNAME www.unrealestate.au | \`${WWW_CNAME:-<empty>}\` | \`${{ steps.dns.outputs.ingress_fqdn }}\` | $([ "${WWW_CNAME%.}" = "${{ steps.dns.outputs.ingress_fqdn }}" ] && echo "✅" || echo "❌") |"
          } >> $GITHUB_STEP_SUMMARY

      - name: Bind apex (unrealestate.au)
        run: |
          az containerapp hostname add \
            --name aigents-web-production \
            --resource-group $AZURE_RESOURCE_GROUP \
            --hostname unrealestate.au \
            || echo "apex hostname already added"

          az containerapp hostname bind \
            --name aigents-web-production \
            --resource-group $AZURE_RESOURCE_GROUP \
            --hostname unrealestate.au \
            --environment aigents-env-production \
            --validation-method TXT

      - name: Bind www (www.unrealestate.au)
        run: |
          az containerapp hostname add \
            --name aigents-web-production \
            --resource-group $AZURE_RESOURCE_GROUP \
            --hostname www.unrealestate.au \
            || echo "www hostname already added"

          az containerapp hostname bind \
            --name aigents-web-production \
            --resource-group $AZURE_RESOURCE_GROUP \
            --hostname www.unrealestate.au \
            --environment aigents-env-production \
            --validation-method CNAME

      - name: Verify HTTPS
        run: |
          {
            echo "## ✅ HTTPS check"
            echo ""
            for host in unrealestate.au www.unrealestate.au; do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "https://$host" || echo "FAIL")
              echo "- \`https://$host\` → HTTP **$code**"
            done
          } >> $GITHUB_STEP_SUMMARY
