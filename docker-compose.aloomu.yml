# ═══════════════════════════════════════════════════════════════
# unrealestate.au — AloomU Stage-0 compose stanza
# ═══════════════════════════════════════════════════════════════
# Knox: merge these two service blocks into docker-compose.stage0.yml
# Network assumed: aloomu_default (containers join automatically)
# Secrets: mount at /run/secrets/<name> via top-level secrets block
# Images: sha-tagged; update <GIT_SHA> on each deploy
# ═══════════════════════════════════════════════════════════════

services:

  unrealestate-web:
    image: git.aloomu.au/tailor/unrealestate-web:<GIT_SHA>
    container_name: unrealestate-web
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
      # Postgres — reads connection string from secret file at startup
      ConnectionStrings__unrealestate_FILE: /run/secrets/unrealestate_db_connstr
      # Redis
      ConnectionStrings__redis: redis:6379
      # API base URL (internal Docker network — no Aspire service discovery)
      API_BASE_URL: http://unrealestate-api:8080
      # Google OAuth
      Google__ClientId_FILE: /run/secrets/unrealestate_google_client_id
      Google__ClientSecret_FILE: /run/secrets/unrealestate_google_client_secret
      # MinIO
      Storage__Endpoint: http://minio:9000
      Storage__Bucket: unrealestate-photos
      Storage__AccessKey_FILE: /run/secrets/unrealestate_minio_access_key
      Storage__SecretKey_FILE: /run/secrets/unrealestate_minio_secret_key
      Storage__ForcePathStyle: "true"
      # SMTP
      Smtp__Host: mail.aloomu.au
      Smtp__Port: "587"
      Smtp__Username: admin@unrealestate.au
      Smtp__Password_FILE: /run/secrets/unrealestate_smtp_password
    secrets:
      - unrealestate_db_connstr
      - unrealestate_google_client_id
      - unrealestate_google_client_secret
      - unrealestate_minio_access_key
      - unrealestate_minio_secret_key
      - unrealestate_smtp_password
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g
        reservations:
          memory: 256m
    pids_limit: 300
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  unrealestate-api:
    image: git.aloomu.au/tailor/unrealestate-api:<GIT_SHA>
    container_name: unrealestate-api
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
      # Postgres
      ConnectionStrings__unrealestate_FILE: /run/secrets/unrealestate_db_connstr
      # Redis
      ConnectionStrings__redis: redis:6379
      # Azure OpenAI (retained as fallback during AloomU Reason ramp)
      AzureAI__Endpoint_FILE: /run/secrets/unrealestate_azure_ai_endpoint
      AzureAI__ApiKey_FILE: /run/secrets/unrealestate_azure_ai_key
      AzureAI__DeploymentName: gpt-4.1
      # JWT
      Jwt__Issuer: unrealestate.au
      Jwt__Audience: unrealestate.au
      Jwt__Secret_FILE: /run/secrets/unrealestate_jwt_secret
      # Google OAuth
      Google__ClientId_FILE: /run/secrets/unrealestate_google_client_id
      Google__ClientSecret_FILE: /run/secrets/unrealestate_google_client_secret
      # MinIO
      Storage__Endpoint: http://minio:9000
      Storage__Bucket: unrealestate-photos
      Storage__AccessKey_FILE: /run/secrets/unrealestate_minio_access_key
      Storage__SecretKey_FILE: /run/secrets/unrealestate_minio_secret_key
      Storage__ForcePathStyle: "true"
    secrets:
      - unrealestate_db_connstr
      - unrealestate_google_client_id
      - unrealestate_google_client_secret
      - unrealestate_azure_ai_endpoint
      - unrealestate_azure_ai_key
      - unrealestate_jwt_secret
      - unrealestate_minio_access_key
      - unrealestate_minio_secret_key
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
        reservations:
          memory: 128m
    pids_limit: 200
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

# ─────────────────────────────────────────────────────────────
# Secrets to declare in docker-compose.stage0.yml top-level:
# ─────────────────────────────────────────────────────────────
# secrets:
#   unrealestate_db_connstr:
#     file: /run/secrets/unrealestate_db_connstr
#   unrealestate_google_client_id:
#     file: /run/secrets/unrealestate_google_client_id
#   unrealestate_google_client_secret:
#     file: /run/secrets/unrealestate_google_client_secret
#   unrealestate_azure_ai_endpoint:
#     file: /run/secrets/unrealestate_azure_ai_endpoint
#   unrealestate_azure_ai_key:
#     file: /run/secrets/unrealestate_azure_ai_key
#   unrealestate_jwt_secret:
#     file: /run/secrets/unrealestate_jwt_secret
#   unrealestate_minio_access_key:
#     file: /run/secrets/unrealestate_minio_access_key
#   unrealestate_minio_secret_key:
