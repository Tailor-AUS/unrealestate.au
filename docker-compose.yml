# ═══════════════════════════════════════════════════════════════
# unrealestate.au — LOCAL DEV (Docker Compose)
# ═══════════════════════════════════════════════════════════════
# Mirrors the AloomU Stage-0 substrate: Postgres 16, Redis, MinIO.
# Run: docker compose up -d
# After first start, generate migrations:
#   dotnet ef migrations add InitialCreate \
#     --project src/Aigents.Infrastructure \
#     --startup-project src/Aigents.Api
# ═══════════════════════════════════════════════════════════════

services:
  # ─────────────────────────────────────────────────────────────
  # POSTGRES 16  (matches AloomU substrate exactly)
  # ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: unrealestate-postgres
    environment:
      POSTGRES_DB: unrealestate
      POSTGRES_USER: unrealestate
      POSTGRES_PASSWORD: localdev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unrealestate -d unrealestate"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ─────────────────────────────────────────────────────────────
  # REDIS
  # ─────────────────────────────────────────────────────────────
  redis:
    image: redis:alpine
    container_name: unrealestate-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────
  # MINIO  (S3-compatible object storage — matches AloomU)
  # Console: http://localhost:9001  user: minioadmin / minioadmin
  # ─────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: unrealestate-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────
  # MAILDEV (local email testing — http://localhost:1080)
  # ─────────────────────────────────────────────────────────────
  maildev:
    image: maildev/maildev:latest
    container_name: unrealestate-mail
    ports:
      - "1080:1080"
      - "1025:1025"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:1080"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
  minio-data:
